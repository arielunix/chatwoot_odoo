<svg width="1000" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>TULOGICA – Logo Unificado Pro</title>
  <defs>
    <!-- Fondo -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#010c1e"/>
      <stop offset="100%" stop-color="#020f28"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="52%">
      <stop offset="0%"   stop-color="#0d47a1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#010c1e" stop-opacity="0"/>
    </radialGradient>

    <!-- TUL: blanco neón -->
    <linearGradient id="tulG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a1a3a"/>
      <stop offset="55%"  stop-color="#0d2257"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>

    <!-- GICA: azul oscuro neón profundo -->
    <linearGradient id="gicaG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0055dd"/>
      <stop offset="40%"  stop-color="#0033bb"/>
      <stop offset="100%" stop-color="#001f99"/>
    </linearGradient>

    <!-- Infinito: gradiente principal azul-cyan -->
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d47a1"/>
      <stop offset="25%"  stop-color="#0d6efd"/>
      <stop offset="55%"  stop-color="#00b4d8"/>
      <stop offset="80%"  stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#00cfff"/>
    </linearGradient>

    <!-- Partícula de flujo -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00cfff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#ffffff"  stop-opacity="1"/>
      <stop offset="60%"  stop-color="#00cfff"  stop-opacity="1"/>
      <stop offset="100%" stop-color="#00cfff" stop-opacity="0"/>
    </linearGradient>

    <!-- Brillo especular izquierdo -->
    <linearGradient id="shineL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>
    <!-- Brillo especular derecho -->
    <linearGradient id="shineR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtítulo separador -->
    <linearGradient id="subG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#38bdf8"  stop-opacity="0.85"/>
      <stop offset="80%"  stop-color="#38bdf8"  stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8"  stop-opacity="0"/>
    </linearGradient>

    <!-- FILTROS TEXTO -->
    <filter id="fTUL" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0.7 0.85 1 0 0.15
                0.7 0.85 1 0 0.25
                1   1   1  0 0.5
                0   0   0  1 0" result="t"/>
      <feMerge><feMergeNode in="t"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fGICA" x="-15%" y="-60%" width="130%" height="220%">
      <!-- Capa 1: halo exterior muy difuso azul intenso -->
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feColorMatrix in="b1" type="matrix"
        values="0   0.1 1   0 0.05
                0   0.3 1   0 0.15
                0.2 0.7 1   0 0.55
                0   0   0   1 0" result="halo1"/>
      <!-- Capa 2: halo medio -->
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feColorMatrix in="b2" type="matrix"
        values="0   0.15 1  0 0.1
                0   0.4  1  0 0.2
                0.1 0.8  1  0 0.6
                0   0    0  1 0" result="halo2"/>
      <!-- Capa 3: brillo interno -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b3"/>
      <feColorMatrix in="b3" type="matrix"
        values="0   0.2  1  0 0.2
                0   0.5  1  0 0.3
                0   1    1  0 0.7
                0   0    0  1 0" result="soft"/>
      <feMerge>
        <feMergeNode in="halo1"/>
        <feMergeNode in="halo2"/>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- FILTROS INFINITO -->
    <filter id="fSymbol" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fNode" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Filtro neón para subtítulo -->
    <filter id="fSub" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feColorMatrix in="b1" type="matrix"
        values="0   0.15 1  0 0.05
                0   0.4  1  0 0.15
                0.1 0.8  1  0 0.5
                0   0    0  1 0" result="halo"/>
      <feGaussianBlur stdDeviation="1.5" result="b2"/>
      <feColorMatrix in="b2" type="matrix"
        values="0   0.2  1  0 0.1
                0   0.5  1  0 0.2
                0   0.9  1  0 0.6
                0   0    0  1 0" result="soft"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fCore" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- PATH INFINITO (como la "O", centrado en 450,104, escala 0.3288 del pro) -->
    <path id="infPath"
      d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
         C 451,82 458,75 469,75 C 484,75 498,87 498,104
         C 498,121 484,133 469,133 C 458,133 451,126 450,119
         C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
      fill="none"/>
  </defs>

  <!-- ══ FONDO ══ -->


  <!-- ══ ESQUINAS TECH ══ -->
  <line x1="0"    y1="18"  x2="22"   y2="18"  stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="18"   y1="0"   x2="18"   y2="22"  stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="1000" y1="18"  x2="978"  y2="18"  stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="982"  y1="0"   x2="982"  y2="22"  stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="0"    y1="242" x2="22"   y2="242" stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="18"   y1="260" x2="18"   y2="238" stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="1000" y1="242" x2="978"  y2="242" stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>
  <line x1="982"  y1="260" x2="982"  y2="238" stroke="#2563eb" stroke-width="1.2" opacity="0.7"/>

  <!-- ══ TEXTO: TUL ══ -->
  <text x="400" y="160" text-anchor="end"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="114" font-weight="200" letter-spacing="4"
    fill="url(#tulG)" filter="url(#fTUL)">TUL</text>

  <!-- ══ SÍMBOLO INFINITO PRO (como la O, centrado en 450,104) ══ -->

  <!-- Halo ambiental -->
  <ellipse cx="450" cy="104" rx="56" ry="34" fill="#1565c0" opacity="0.10"/>

  <!-- Red neuronal fondo (sutil, dentro del espacio del símbolo) -->
  <line x1="404" y1="80"  x2="496" y2="80"  stroke="#1565c0" stroke-width="0.5" opacity="0.15"/>
  <line x1="404" y1="128" x2="496" y2="128" stroke="#1565c0" stroke-width="0.5" opacity="0.15"/>
  <line x1="404" y1="80"  x2="450" y2="128" stroke="#00b4d8" stroke-width="0.4" opacity="0.10"/>
  <line x1="496" y1="80"  x2="450" y2="128" stroke="#00b4d8" stroke-width="0.4" opacity="0.10"/>
  <line x1="404" y1="128" x2="450" y2="80"  stroke="#00b4d8" stroke-width="0.4" opacity="0.10"/>
  <line x1="496" y1="128" x2="450" y2="80"  stroke="#00b4d8" stroke-width="0.4" opacity="0.10"/>

  <!-- Arcos orbitales animados -->
  <path d="M 393,88 C 389,88 386,95 386,104 C 386,113 389,120 393,120"
    fill="none" stroke="#0d6efd" stroke-width="0.9" stroke-dasharray="3,5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M 507,88 C 511,88 514,95 514,104 C 514,113 511,120 507,120"
    fill="none" stroke="#0d6efd" stroke-width="0.9" stroke-dasharray="3,5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Sombra volumétrica -->
  <path d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
           C 451,82 458,75 469,75 C 484,75 498,87 498,104
           C 498,121 484,133 469,133 C 458,133 451,126 450,119
           C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
    fill="none" stroke="#0d47a1" stroke-width="18" stroke-opacity="0.18" stroke-linecap="round"
    transform="translate(0,2)"/>

  <!-- Trazo principal con gradiente y glow -->
  <path d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
           C 451,82 458,75 469,75 C 484,75 498,87 498,104
           C 498,121 484,133 469,133 C 458,133 451,126 450,119
           C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
    fill="none" stroke="url(#infGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#fSymbol)"/>

  <!-- Trazo interior efecto cristal -->
  <path d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
           C 451,82 458,75 469,75 C 484,75 498,87 498,104
           C 498,121 484,133 469,133 C 458,133 451,126 450,119
           C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
    fill="none" stroke="#00cfff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.22"/>

  <!-- Partícula flujo 1 -->
  <path d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
           C 451,82 458,75 469,75 C 484,75 498,87 498,104
           C 498,121 484,133 469,133 C 458,133 451,126 450,119
           C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
    fill="none" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="35 200">
    <animate attributeName="stroke-dashoffset" from="235" to="-235" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- Partícula flujo 2 (desfasada) -->
  <path d="M 402,104 C 402,87 416,75 431,75 C 442,75 449,82 450,89
           C 451,82 458,75 469,75 C 484,75 498,87 498,104
           C 498,121 484,133 469,133 C 458,133 451,126 450,119
           C 449,126 442,133 431,133 C 416,133 402,121 402,104 Z"
    fill="none" stroke="#00cfff" stroke-width="2" stroke-linecap="round"
    stroke-dasharray="22 213">
    <animate attributeName="stroke-dashoffset" from="235" to="-235" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- Partícula flujo 3 (inversa) -->
  <path d="M 498,104 C 498,87 484,75 469,75 C 458,75 451,82 450,89
           C 449,82 442,75 431,75 C 416,75 402,87 402,104
           C 402,121 416,133 431,133 C 442,133 449,126 450,119
           C 451,126 458,133 469,133 C 484,133 498,121 498,104 Z"
    fill="none" stroke="#0d6efd" stroke-width="1.5" stroke-linecap="round"
    stroke-dasharray="18 217">
    <animate attributeName="stroke-dashoffset" from="235" to="-235" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Brillos especulares -->
  <path d="M 410,94 C 414,85 422,78 431,76 C 439,74 446,79 449,85"
    fill="none" stroke="url(#shineL)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M 451,85 C 454,79 461,74 469,76 C 478,78 486,85 490,94"
    fill="none" stroke="url(#shineR)" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- SINAPSIS (líneas entre nodos) -->
  <!-- Loop izquierdo -->
  <line x1="402" y1="104" x2="415" y2="83"  stroke="#00b4d8" stroke-width="0.9" opacity="0.50"/>
  <line x1="402" y1="104" x2="415" y2="125" stroke="#00b4d8" stroke-width="0.9" opacity="0.50"/>
  <line x1="415" y1="83"  x2="432" y2="76"  stroke="#0d6efd" stroke-width="0.8" opacity="0.40"/>
  <line x1="415" y1="125" x2="432" y2="132" stroke="#0d6efd" stroke-width="0.8" opacity="0.40"/>
  <line x1="432" y1="76"  x2="450" y2="104" stroke="#0d6efd" stroke-width="0.7" opacity="0.32"/>
  <line x1="432" y1="132" x2="450" y2="104" stroke="#0d6efd" stroke-width="0.7" opacity="0.32"/>
  <line x1="415" y1="83"  x2="432" y2="132" stroke="#00cfff" stroke-width="0.6" opacity="0.22"/>
  <line x1="415" y1="125" x2="432" y2="76"  stroke="#00cfff" stroke-width="0.6" opacity="0.22"/>
  <!-- Loop derecho -->
  <line x1="498" y1="104" x2="485" y2="83"  stroke="#00b4d8" stroke-width="0.9" opacity="0.50"/>
  <line x1="498" y1="104" x2="485" y2="125" stroke="#00b4d8" stroke-width="0.9" opacity="0.50"/>
  <line x1="485" y1="83"  x2="468" y2="76"  stroke="#0d6efd" stroke-width="0.8" opacity="0.40"/>
  <line x1="485" y1="125" x2="468" y2="132" stroke="#0d6efd" stroke-width="0.8" opacity="0.40"/>
  <line x1="468" y1="76"  x2="450" y2="104" stroke="#0d6efd" stroke-width="0.7" opacity="0.32"/>
  <line x1="468" y1="132" x2="450" y2="104" stroke="#0d6efd" stroke-width="0.7" opacity="0.32"/>
  <line x1="485" y1="83"  x2="468" y2="132" stroke="#00cfff" stroke-width="0.6" opacity="0.22"/>
  <line x1="485" y1="125" x2="468" y2="76"  stroke="#00cfff" stroke-width="0.6" opacity="0.22"/>
  <!-- Línea central punteada -->
  <line x1="402" y1="104" x2="498" y2="104"
    stroke="#1565c0" stroke-width="0.5" opacity="0.15" stroke-dasharray="2,4"/>

  <!-- NODOS SECUNDARIOS -->
  <circle cx="415" cy="83"  r="4.5" fill="#0d5fa8" stroke="#00cfff" stroke-width="1.6" filter="url(#fNode)"/>
  <circle cx="415" cy="83"  r="1.8" fill="#bfdbfe"/>
  <circle cx="415" cy="125" r="4.5" fill="#0d5fa8" stroke="#00cfff" stroke-width="1.6" filter="url(#fNode)"/>
  <circle cx="415" cy="125" r="1.8" fill="#bfdbfe"/>
  <circle cx="485" cy="83"  r="4.5" fill="#0d5fa8" stroke="#00cfff" stroke-width="1.6" filter="url(#fNode)"/>
  <circle cx="485" cy="83"  r="1.8" fill="#bfdbfe"/>
  <circle cx="485" cy="125" r="4.5" fill="#0d5fa8" stroke="#00cfff" stroke-width="1.6" filter="url(#fNode)"/>
  <circle cx="485" cy="125" r="1.8" fill="#bfdbfe"/>

  <!-- NODOS PEQUEÑOS cuadrante -->
  <circle cx="432" cy="76"  r="3.2" fill="#1565c0" stroke="#38bdf8" stroke-width="1.3" filter="url(#fNode)"/>
  <circle cx="432" cy="132" r="3.2" fill="#1565c0" stroke="#38bdf8" stroke-width="1.3" filter="url(#fNode)"/>
  <circle cx="468" cy="76"  r="3.2" fill="#1565c0" stroke="#38bdf8" stroke-width="1.3" filter="url(#fNode)"/>
  <circle cx="468" cy="132" r="3.2" fill="#1565c0" stroke="#38bdf8" stroke-width="1.3" filter="url(#fNode)"/>

  <!-- NODOS EXTREMOS izq/der -->
  <circle cx="402" cy="104" r="7" fill="#0d47a1" stroke="#00b4d8" stroke-width="2" filter="url(#fNode)">
    <animate attributeName="r" values="6.5;8;6.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="402" cy="104" r="3" fill="#7dd3fc"/>
  <circle cx="498" cy="104" r="7" fill="#0d47a1" stroke="#00b4d8" stroke-width="2" filter="url(#fNode)">
    <animate attributeName="r" values="6.5;8;6.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="498" cy="104" r="3" fill="#7dd3fc"/>

  <!-- NODO CENTRAL (cruce del 8) -->
  <!-- Anillos pulsantes -->
  <circle cx="450" cy="104" fill="none" stroke="#00cfff" stroke-width="0.9">
    <animate attributeName="r"       values="12;17;12" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.04;0.18" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="104" fill="none" stroke="#0d6efd" stroke-width="1.1">
    <animate attributeName="r"       values="8;12;8" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.32;0.10;0.32" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Core sólido -->
  <circle cx="450" cy="104" r="7" fill="#0a2060" stroke="#00cfff" stroke-width="2" filter="url(#fCore)">
    <animate attributeName="r" values="6;8;6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="104" r="3.5" fill="#00cfff" opacity="0.95"/>
  <circle cx="450" cy="104" r="1.5" fill="#ffffff"/>

  <!-- Micro-partículas estáticas -->
  <circle cx="417" cy="80"  r="1.6" fill="#ffffff" opacity="0.7"  filter="url(#fNode)"/>
  <circle cx="483" cy="80"  r="1.4" fill="#00cfff" opacity="0.6"  filter="url(#fNode)"/>
  <circle cx="432" cy="133" r="1.4" fill="#7dd3fc" opacity="0.55"/>
  <circle cx="468" cy="133" r="1.4" fill="#7dd3fc" opacity="0.55"/>

  <!-- ══ TEXTO: GICA ══ -->
  <!-- Halo exterior difuso -->
  <text x="505" y="160"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="114" font-weight="200" letter-spacing="4"
    fill="#0066ff" opacity="0.35">GICA</text>
  <!-- Principal neón -->
  <text x="505" y="160"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="114" font-weight="200" letter-spacing="4"
    fill="url(#gicaG)" filter="url(#fGICA)">GICA</text>
  <!-- Filo cyan -->
  <text x="505" y="160"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="114" font-weight="200" letter-spacing="4"
    fill="none" stroke="#00aaff" stroke-width="1.0" opacity="1.0">GICA</text>
  <!-- Filo blanco crisp -->
  <text x="505" y="160"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="114" font-weight="200" letter-spacing="4"
    fill="none" stroke="#6699ff" stroke-width="0.4" opacity="0.6">GICA</text>

  <!-- ══ LÍNEA SEPARADORA + SUBTÍTULO ══ -->
  <rect x="100" y="188" width="800" height="1.5" fill="url(#subG)" rx="0.5" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Halo neón subtítulo -->
  <text x="500" y="216" text-anchor="middle"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="12" font-weight="400" letter-spacing="6"
    fill="#0066ff" opacity="0.5" filter="url(#fSub)">COMUNICACIÓN INTELIGENTE</text>
  <!-- Texto negro con neón encima -->
  <text x="500" y="216" text-anchor="middle"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="12" font-weight="600" letter-spacing="6"
    fill="#0a0a0a" filter="url(#fSub)">COMUNICACIÓN INTELIGENTE</text>
  <!-- Filo neón cyan encima para que brille -->
  <text x="500" y="216" text-anchor="middle"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="12" font-weight="600" letter-spacing="6"
    fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.9">COMUNICACIÓN INTELIGENTE</text>

  <!-- Puntos decorativos -->
  <circle cx="790" cy="212" r="2.5" fill="#2563eb" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
