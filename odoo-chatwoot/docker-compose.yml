version: '3.8'

services:
  backend:
    image: arielunix/odoo-adapater-backend:latest
    container_name: odoo-chatwoot-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - odoo-chatwoot-network

  frontend:
    image: arielunix/odoo-adapater-frontend:latest
    container_name: odoo-chatwoot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - odoo-chatwoot-network

networks:
  odoo-chatwoot-network:
    driver: bridge
